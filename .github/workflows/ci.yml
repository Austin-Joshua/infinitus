name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Asset Check, Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Advisory audit check for production dependencies.
      # Note: The current advisory stems exclusively from Next.js's internal bundled copy
      # of postcss (GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q). Direct project dependencies
      # (postcss@8.5.26, tailwindcss@3.4.19) are up to date. continue-on-error is kept active
      # while awaiting upstream Next.js 15.5.x patch release. Re-check date: 2026-12-18.
      - name: Security audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Lint codebase
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Check asset integrity
        run: npm run check:assets

      - name: Verify backdrop blur performance budget
        run: npm run check:blur

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://infinitus-seven.vercel.app

      - name: Check site links and routes
        run: npm run check:links

      - name: Run Playwright E2E test suite
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://infinitus-seven.vercel.app
